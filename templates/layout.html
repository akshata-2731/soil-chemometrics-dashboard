<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Nutrient Prediction Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #f2fbf4;
    --surface: #ffffff;
    --surface2: #f9fdfa;
    --border: #c3e6cb;
    --accent: #28a745;
    --accent2: #20c997;
    --accent3: #17a2b8;
    --accent4: #6f42c1;
    --warn: #ffc107;
    --danger: #dc3545;
    --text: #1a3320;
    --muted: #6c757d;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; }
  .logo-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    gap: 4px;
    overflow-x: auto;
  }
  .tab {
    padding: 10px 16px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* PANELS */
  .panel { display: none; padding: 24px; }
  .panel.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  /* WAVELENGTH INPUTS */
  .wavelength-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wavelength-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    color: var(--accent2);
  }
  input[type="number"], input[type="text"], select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 7px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent2);
  }

  /* BUTTONS */
  .btn {
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--accent2);
    color: #ffffff;
  }
  .btn-primary:hover { background: #79c0ff; }
  .btn-success {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-success:hover { background: #56d364; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-warn {
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--warn);
  }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* RESULTS */
  .nutrient-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .nutrient-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .nutrient-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
  }
  .nutrient-card.oc::before { background: #39d353; }
  .nutrient-card.n::before { background: #58a6ff; }
  .nutrient-card.p::before { background: #f0883e; }
  .nutrient-card.k::before { background: #bc8cff; }
  .nutrient-card.ca::before { background: #ffa657; }
  .nutrient-card.mg::before { background: #79c0ff; }
  .nutrient-card.s::before { background: #d2a8ff; }
  .nutrient-card.fe::before { background: #ff7b72; }
  .nutrient-card.mn::before { background: #ffa198; }
  .nutrient-card.cu::before { background: #7ee787; }
  .nutrient-card.zn::before { background: #56d364; }
  .nutrient-card.b::before { background: #e3b341; }

  .nc-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .nc-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
  .nc-value { font-size: 22px; font-weight: 600; font-family: 'Syne', sans-serif; }
  .nc-unit { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* STATUS BADGE */
  .badge {
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge-low { background: rgba(248,81,73,0.15); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
  .badge-ok { background: rgba(57,211,83,0.15); color: var(--accent); border: 1px solid rgba(57,211,83,0.3); }
  .badge-high { background: rgba(210,153,34,0.15); color: var(--warn); border: 1px solid rgba(210,153,34,0.3); }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 11px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    font-size: 12px;
  }
  tr:hover td { background: rgba(0,0,0,0.03); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  /* JSON EDITOR */
  .json-editor {
    background: #f9fdfa;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
    min-height: 300px;
    resize: vertical;
    width: 100%;
    line-height: 1.6;
  }

  /* FILE UPLOAD */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--muted);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(88,166,255,0.05);
  }
  .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
  .drop-zone p { font-size: 12px; }

  /* PROGRESS BAR */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  /* ALERT */
  .alert {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .alert-info { background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.3); color: var(--accent2); }
  .alert-success { background: rgba(57,211,83,0.1); border: 1px solid rgba(57,211,83,0.3); color: var(--accent); }
  .alert-warn { background: rgba(210,153,34,0.1); border: 1px solid rgba(210,153,34,0.3); color: var(--warn); }
  .alert-error { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: var(--danger); }

  /* MINI CHART */
  .mini-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .mini-bar-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent2);
    transition: width 0.6s ease;
    max-width: 100%;
  }
  .mini-bar-label { font-size: 10px; color: var(--muted); width: 40px; text-align: right; }

  /* LOGIC PLUGIN */
  .plugin-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .plugin-card:hover { border-color: var(--accent2); }
  .plugin-card.active-plugin { border-color: var(--accent); }
  .plugin-name { font-weight: 600; font-size: 12px; }
  .plugin-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .plugin-badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; }

  /* HISTORY */
  .history-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .history-item:hover { border-color: var(--accent2); }
  .history-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

  /* SEPARATOR */
  .sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  /* STATUS DOT */
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.green { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.yellow { background: var(--warn); }
  .status-dot.red { background: var(--danger); }

  .flex { display: flex; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-8 { gap: 8px; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }

  /* EXPORT */
  .export-block {
    background: #f9fdfa;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    font-size: 11px;
    overflow-x: auto;
    white-space: pre;
    max-height: 200px;
    overflow-y: auto;
    color: #7ee787;
  }

  code {
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--accent3);
  }

  /* PER-NUTRIENT LOGIC MATRIX */
  .nlm-row {
    display: grid;
    grid-template-columns: 22px 90px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(195,230,203,0.4);
  }
  .nlm-row:last-child { border-bottom: none; }
  .nlm-check { accent-color: var(--accent2); width: 15px; height: 15px; cursor: pointer; }
  .nlm-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .nlm-name .nlm-sub { font-size: 10px; color: var(--muted); font-weight: 400; }
  .nlm-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 5px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 100%;
    transition: border-color 0.15s;
  }
  .nlm-select:focus { outline: none; border-color: var(--accent2); }
  .nlm-select:disabled { opacity: 0.4; cursor: not-allowed; }
  .nlm-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nlm-row.disabled .nlm-name { opacity: 0.4; }

  .nlm-header {
    display: grid;
    grid-template-columns: 22px 90px 1fr auto;
    gap: 8px;
    padding: 0 0 6px 0;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  .nlm-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .nlm-action-btn {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .nlm-action-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .grid-2, .grid-4 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .nlm-row { grid-template-columns: 22px 70px 1fr 10px; }
  }
</style>
